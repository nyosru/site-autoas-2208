name: Deploy prod avtoas

on:
  push:
    branches:
      - prod


env:
  VPS_IP: 46.254.19.97
  VPS_USERNAME: di4basa7
  xVPS_USERNAME: root
  xDIR: www/prod
  DIR: /var/www/di4basa7/data/www/prod
  GIT_BRANCH: origin/prod
  TELEGRAM_TO: 360209578, 1022228978, 663501687   # я / Авто-АС / Денис Авто-СА

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Set up SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ env.VPS_IP }} >> ~/.ssh/known_hosts

      - name: git pull on server
#        uses: appleboy/ssh-action@master
        run: |
          cd www
          cd ${{ env.DIR }}
          git config --global user.email "1@php-cat.com"
          git config --global user.name "Sergey"
          git fetch --all
          git reset --hard origin/prod


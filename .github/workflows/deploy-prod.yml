      - name: setup composer pacs on server + migrate
        uses: appleboy/ssh-action@master
        with:
          host: ${{ env.VPS_IP }}
          username: ${{ env.VPS_USERNAME }}
          password: ${{ secrets.SERVER_PASSWORD }}
          script: |
            cd ${{ env.DIR }}
            /opt/php80/bin/php ./composer.phar i --no-dev
            /opt/php80/bin/php artisan migrate

      - name: setup npm
        uses: appleboy/ssh-action@master
        with:
          host: ${{ env.VPS_IP }}
          username: ${{ env.VPS_USERNAME }}
          password: ${{ secrets.SERVER_PASSWORD }}
          script: |
            cd ${{ env.DIR }}
#            chown -R di4basa7:di4basa7 public/
            chown -R www-data:www-data ./
            npm i
            npm run prod


      - name: git pull on server
        uses: appleboy/ssh-action@master
        with:
          host: ${{ env.VPS_IP }}
          username: ${{ env.VPS_USERNAME }}
          password: ${{ secrets.SERVER_PASSWORD }}
          # username: ${{ secrets.SERVER_USERNAME }}
